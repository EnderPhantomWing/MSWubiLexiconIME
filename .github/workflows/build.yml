name: Wubi Lexicon Build

on:
  push:
    branches: [ main ]
    paths:
      - 'input.tsv'
      - 'wubi_converter.py'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'input.tsv'
      - 'wubi_converter.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布 Release（tag = 本次 run number）'
        type: boolean
        default: false
      prerelease:
        description: '将 Release 标记为 prerelease'
        type: boolean
        default: true
      commit_results:
        description: '将生成结果提交回仓库'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wubi-convert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不启用 cache: pip，避免无 requirements.txt 时 setup-python 报错
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "未找到 requirements.txt，跳过依赖安装"
          fi

      - name: Sanity check inputs
        run: |
          test -f wubi_converter.py || { echo "缺少 wubi_converter.py"; exit 1; }
          test -f input.tsv        || { echo "缺少 input.tsv"; exit 1; }
          echo "input.tsv 行数: $(wc -l < input.tsv)"

      - name: Run converter (--strict)
        run: |
          python wubi_converter.py input.tsv \
            --strict \
            --output wubi_custom_lexicon.dat \
            --json   wubi_custom_lexicon.json

      - name: Show outputs
        run: |
          ls -lh wubi_custom_lexicon.dat wubi_custom_lexicon.json
          echo '--- dat (head) ---'
          head -n 5 wubi_custom_lexicon.dat || true
          echo '--- json (head) ---'
          head -n 5 wubi_custom_lexicon.json || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wubi-lexicon-${{ github.run_number }}
          path: |
            wubi_custom_lexicon.dat
            wubi_custom_lexicon.json
          if-no-files-found: error
          retention-days: 30

      # ---------- Release：push 时默认发布 prerelease ----------
      - name: Publish prerelease (push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Wubi lexicon build #${TAG}" \
            --notes "Auto-built from commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`." \
            --prerelease \
            wubi_custom_lexicon.dat wubi_custom_lexicon.json

      # ---------- Release：手动触发时按需发布 ----------
      - name: Publish release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.run_number }}"
          PRE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "Wubi lexicon build #${TAG}" \
            --notes "Manual build from commit \`${{ github.sha }}\`." \
            $PRE_FLAG \
            wubi_custom_lexicon.dat wubi_custom_lexicon.json